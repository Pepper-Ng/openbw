name: Publish OpenBW container

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: openbw-container-core
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WASI SDK
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar xz
          echo "WASI_SDK=$PWD/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build wasm
        run: bash web/build-wasm.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/openbw.js web/net.js web/openbw.wasm _site/
          mkdir -p _site/vendor
          cp web/vendor/lucide.min.js web/vendor/lucide-LICENSE _site/vendor/
          if compgen -G "web/maps/*.scx" > /dev/null; then
            mkdir -p _site/maps
            cp web/maps/*.scx _site/maps/
          fi
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" _site/index.html _site/openbw.js

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/pepper-ng/openbw:master
            ghcr.io/pepper-ng/openbw:sha-${{ github.sha }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_id="$(gh api graphql -f query='query { user(login: "Pepper-Ng") { packages(first: 100, packageType: CONTAINER) { nodes { id name } } } }' --jq '.data.user.packages.nodes[] | select(.name == "openbw") | .id')"
          test -n "$package_id"
          gh api graphql -f query='mutation($packageId: ID!) { updatePackageVisibility(input: { packageId: $packageId, visibility: PUBLIC }) { package { visibility } } }' -F packageId="$package_id" --jq '.data.updatePackageVisibility.package.visibility' | grep -qx PUBLIC

      - name: Mark published image for Portainer polling
        run: |
          printf '%s\n' "$GITHUB_SHA" > .deployment-image
          if git diff --quiet -- .deployment-image; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment-image
          git commit -m "Record deployed image ${GITHUB_SHA::12} [skip ci]"
          git push origin HEAD:master