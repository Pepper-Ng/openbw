services:
  openbw:
    build:
      context: .
      dockerfile: Dockerfile
    image: openbw:latest
    pull_policy: build
    container_name: openbw
    restart: unless-stopped
    depends_on:
      signalling:
        condition: service_healthy
    volumes:
      - campaign-data:/opt/openbw/web/data
    ports:
      - "18082:80"

  signalling:
    build:
      context: .
      dockerfile: Dockerfile
      target: signalling
    image: openbw-signalling:latest
    pull_policy: build
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/signal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  campaign-data: